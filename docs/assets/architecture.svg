<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-label="PlantOS control loop">
  <rect width="920" height="420" rx="16" fill="#0c141b"/>
  <text x="32" y="42" fill="#e6eef4" font-family="IBM Plex Sans, sans-serif" font-size="20" font-weight="600">Closed-loop architecture</text>
  <text x="32" y="64" fill="#9eb0be" font-family="IBM Plex Sans, sans-serif" font-size="13">The controller never sees true future weather or hidden plant reality.</text>

  <g font-family="IBM Plex Sans, sans-serif" font-size="13">
    <rect x="32" y="92" width="200" height="70" rx="10" fill="#101820" stroke="#4fc3f7"/>
    <text x="48" y="122" fill="#4fc3f7">Weather</text>
    <text x="48" y="142" fill="#d5e0ea">Actual GHI / cloud</text>

    <rect x="272" y="92" width="200" height="70" rx="10" fill="#101820" stroke="#7ee0ff"/>
    <text x="288" y="122" fill="#7ee0ff">Forecast</text>
    <text x="288" y="142" fill="#d5e0ea">Bias, AR(1), dropouts</text>

    <rect x="512" y="92" width="200" height="70" rx="10" fill="#101820" stroke="#3ddc97"/>
    <text x="528" y="122" fill="#3ddc97">Estimator</text>
    <text x="528" y="142" fill="#d5e0ea">Kalman-style belief</text>

    <rect x="688" y="196" width="200" height="70" rx="10" fill="#101820" stroke="#e8c547"/>
    <text x="704" y="226" fill="#e8c547">MPC / rules</text>
    <text x="704" y="246" fill="#d5e0ea">Action from belief</text>

    <rect x="272" y="196" width="200" height="70" rx="10" fill="#101820" stroke="#e85d5d"/>
    <text x="288" y="226" fill="#e85d5d">FDD + isolation</text>
    <text x="288" y="246" fill="#d5e0ea">Residuals ’ mode</text>

    <rect x="32" y="300" width="380" height="70" rx="10" fill="#101820" stroke="#b39ddb"/>
    <text x="48" y="330" fill="#b39ddb">Plant reality</text>
    <text x="48" y="350" fill="#d5e0ea">PV · battery · stack · DAC · methanation</text>

    <rect x="440" y="300" width="248" height="70" rx="10" fill="#101820" stroke="#9eb0be"/>
    <text x="456" y="330" fill="#9eb0be">Sensors</text>
    <text x="456" y="350" fill="#d5e0ea">Noise, drift, freeze, fail</text>
  </g>

  <g fill="none" stroke="#3a5366" stroke-width="1.8" marker-end="url(#a)">
    <path d="M232 127 H272"/>
    <path d="M472 127 H512"/>
    <path d="M612 162 V231 H688"/>
    <path d="M512 162 V231 H472"/>
    <path d="M372 266 V300"/>
    <path d="M788 266 V335 H688"/>
    <path d="M412 335 H440"/>
    <path d="M132 300 V196 H272" />
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5a7388"/>
    </marker>
  </defs>
</svg>
