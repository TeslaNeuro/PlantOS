# PlantOS stack — API on 8000, operations console on 5173.
# SPDX-License-Identifier: MIT
# Copyright (c) 2026 TeslaNeuro

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./scenarios:/app/scenarios:ro
      - ./experiments/results:/app/experiments/results

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
