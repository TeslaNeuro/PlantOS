[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plantos"
version = "0.1.0"
description = "Autonomous self-healing operating system for renewable-powered industrial plants"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PlantOS Research" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "typer>=0.12",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
]

[project.scripts]
plantos = "plantos.cli:app"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running Monte Carlo or horizon tests",
    "integration: multi-component simulation tests",
]

[tool.ruff]
line-length = 100
src = ["backend"]
