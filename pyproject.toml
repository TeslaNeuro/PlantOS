[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plantos"
version = "0.1.0"
description = "Autonomous self-healing operating system for renewable-powered industrial plants"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PlantOS Research" }]
dependencies = [
    "numpy>=2.5.2",
    "scipy>=1.18",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "typer>=0.27.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1",
    "httpx>=0.28.1",
]

[project.scripts]
plantos = "plantos.cli:app"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running Monte Carlo or horizon tests",
    "integration: multi-component simulation tests",
]

[tool.ruff]
line-length = 100
src = ["backend"]
