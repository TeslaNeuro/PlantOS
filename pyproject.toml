[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plantos"
version = "0.2.0"
description = "Autonomous self-healing operations for renewable-powered industrial plants"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "TeslaNeuro", email = "arshiakeshvariasl@gmail.com" },
]
maintainers = [
    { name = "TeslaNeuro", email = "arshiakeshvariasl@gmail.com" },
]
keywords = [
    "mpc",
    "digital-twin",
    "energy",
    "hydrogen",
    "methanation",
    "fault-diagnosis",
    "operations",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Developers",
]
dependencies = [
    "numpy>=2.5.2",
    "scipy>=1.18",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "typer>=0.27.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1",
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/TeslaNeuro/PlantOS"
Documentation = "https://github.com/TeslaNeuro/PlantOS/tree/main/docs"
Source = "https://github.com/TeslaNeuro/PlantOS"

[project.scripts]
plantos = "plantos.cli:app"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
plantos = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running Monte Carlo or horizon tests",
    "integration: multi-component simulation tests",
]

[tool.ruff]
line-length = 100
src = ["backend"]
